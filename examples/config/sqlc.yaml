version: "2"
plugins:
  - name: gleam
    wasm:
      url: file://../../target/wasm32-wasip1/release/sqlc-gen-gleam.wasm
      sha256: "1df91c0fd9fe345a7cf562c999922ce30d12ce7d07e9fafc7bd57243690439cb"
sql:
  - schema: "postgresql/authors/schema.sql"
    queries: "postgresql/authors/query.sql"
    engine: "postgresql"
    codegen:
      - plugin: gleam
        out: "postgresql/authors/generated"
        options:
          modelsModule: "generated/models"
  - schema: "postgresql/types/schema.sql"
    queries: "postgresql/types/query.sql"
    engine: "postgresql"
    codegen:
      - plugin: gleam
        out: "postgresql/types/generated"
        options:
          modelsModule: "generated/models"
  - schema: "sqlite/authors/schema.sql"
    queries: "sqlite/authors/query.sql"
    engine: "sqlite"
    codegen:
      - plugin: gleam
        out: "sqlite/authors/generated"
  - schema: "sqlite/types/schema.sql"
    queries: "sqlite/types/query.sql"
    engine: "sqlite"
    codegen:
      - plugin: gleam
        out: "sqlite/types/generated"
