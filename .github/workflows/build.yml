name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SQLC_VERSION: "1.30.0"
  GLEAM_VERSION: "1.19.2"
  OTP_VERSION: "28"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint
        run: make lint

      - name: Run unit tests
        run: cargo test

      - name: Build WASM plugin
        run: make build

  # Regenerate every example with the freshly built plugin, check the committed
  # output is up to date, and make sure the generated Gleam code compiles.
  generate-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Install Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Regenerate examples and E2E code
        run: make generate

      - name: Check no diff in generated code
        run: git diff --exit-code -- '*.gleam'

      - name: Generated PostgreSQL code compiles without warnings
        run: cd end2end/gleam_test_project && gleam build --warnings-as-errors

      - name: Generated SQLite code compiles without warnings
        run: cd end2end/gleam_sqlite_test_project && gleam build --warnings-as-errors
