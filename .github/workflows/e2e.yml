name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SQLC_VERSION: "1.30.0"
  GLEAM_VERSION: "1.19.2"
  OTP_VERSION: "28"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_DB: sqlc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # Same host port as end2end/docker-compose.yml, so the tests need no edits.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -d sqlc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Install Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: "3"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Load database schema
        run: |
          cat examples/config/postgresql/types/schema.sql examples/config/postgresql/authors/schema.sql | \
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d sqlc_test -v ON_ERROR_STOP=1 -f -

      - name: Generate Gleam code
        run: make generate

      - name: PostgreSQL E2E tests
        run: cd end2end/gleam_test_project && gleam test

      - name: SQLite E2E tests
        run: cd end2end/gleam_sqlite_test_project && gleam test
