version: "2"
plugins:
  - name: gleam
    wasm:
      url: file://../target/wasm32-wasip1/release/sqlc-gen-gleam.wasm
      sha256: "6780538c2367f572bf7ee89f8a3015a28220976a19f36441d2ee619fd3e2d12c"
sql:
  - schema:
      - "../examples/config/postgresql/authors/schema.sql"
      - "../examples/config/postgresql/types/schema.sql"
    queries:
      - "../examples/config/postgresql/authors/query.sql"
      - "../examples/config/postgresql/types/query.sql"
    engine: "postgresql"
    codegen:
      - plugin: gleam
        out: "gleam_test_project/src/generated"
        options:
          overrides:
            # sqlc cannot type max(): name the column's real type.
            - column: "GetPostgresFunctions:max_integer"
              dbType:
                type: "integer"
            - column: "GetPostgresFunctions:max_varchar"
              dbType:
                type: "varchar"
            - column: "GetPostgresFunctions:max_timestamp"
              dbType:
                type: "timestamp"
                notNull: true
            # sum() of a numeric column is a numeric, not the bigint sqlc says.
            - column: "GetPostgresInferredAggregates:sum_amount"
              dbType:
                type: "numeric"
            - column: "GetPostgresInferredAggregates:max_seen_at"
              dbType:
                type: "timestamptz"
            - column: "GetPostgresInferredAggregates:ids"
              dbType:
                type: "bigint"
                array: true
      # The same queries with arrays that may hold NULLs, and the c_positive
      # domain declared as the integer it is.
      - plugin: gleam
        out: "gleam_test_project/src/generated/nullable_arrays"
        options:
          nullableArrayElements: true
          typeAliases:
            c_positive: "integer"
  - schema:
      - "../examples/config/sqlite/authors/schema.sql"
      - "../examples/config/sqlite/types/schema.sql"
    queries:
      - "../examples/config/sqlite/authors/query.sql"
      - "../examples/config/sqlite/types/query.sql"
    engine: "sqlite"
    codegen:
      - plugin: gleam
        out: "gleam_sqlite_test_project/src/generated"
        options:
          overrides:
            - column: "GetSqliteFunctions:max_integer"
              gleamType:
                type: "Int"
                notNull: false
            - column: "GetSqliteFunctions:max_real"
              gleamType:
                type: "Float"
                notNull: false
            - column: "GetSqliteFunctions:max_text"
              gleamType:
                type: "String"
                notNull: true
      # The same queries for use inside glite.transaction (they take a glite/tx Tx).
      - plugin: gleam
        out: "gleam_sqlite_test_project/src/generated/tx"
        options:
          module: "glite/tx"
          skipModels: true
